# Tempel service `ai` ke docker-compose.yml utama (peran 2).
# Backend memanggil http://ai:8001 di jaringan compose.
services:
  ai:
    build: ./siagamesin-ai
    env_file: ./siagamesin-ai/.env
    ports:
      - "8001:8001"   # hapus bila hanya dipakai backend
    volumes:
      - ai_data:/srv/data                 # indeks RAG + riwayat perbaikan tahan restart
      - ./manuals:/srv/data/manuals       # taruh 2-3 PDF manual motor di sini
    restart: unless-stopped

  # backend:
  #   environment:
  #     AI_SERVICE_URL: http://ai:8001
  #     AI_SERVICE_TOKEN: ${SERVICE_TOKEN}

volumes:
  ai_data:
